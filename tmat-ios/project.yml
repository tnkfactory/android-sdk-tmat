# iOS 샘플 앱. TmatSample.xcodeproj 는 이 파일로 생성한다(xcodegen generate). 생성된 프로젝트도 함께 커밋한다.
name: TmatSample
options:
  deploymentTarget: {iOS: "15.0"}
  bundleIdPrefix: com.tnkfactory
targets:
  TmatSample:
    type: application
    platform: iOS
    sources:
      - path: TmatSample
    dependencies:
      - framework: sdk/TnkTmatSdk.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tnkfactory.tmat.sample
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: TmatSample/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
